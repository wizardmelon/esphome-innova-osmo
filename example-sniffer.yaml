# Passive sniffer for Innova boards other than the OSMO (e.g. multi-zone
# controllers) — NEVER transmits on the bus: no modbus:/climate: configured,
# just logging of received bytes.
#
# Why this exists: the register map in components/innova_osmo was
# reverse-engineered on the ESE845II/INNOVA-M7-V0_3 board (single-zone OSMO).
# Other boards (e.g. multi-zone) may share the same map or use a different
# one: this firmware + tools/wizard.py let you find out WITHOUT removing the
# original WiFi/cloud module or any wired thermostats, because the ESP stays
# passive (RX only) and there's no master conflict on the bus.
#
# Wiring: identical to the OSMO fancoil, see README.md (level shifter
# mandatory, bus in the 5V domain, watch out for the EN pin). Here the ESP
# never transmits commands so in theory the TX/D8 line isn't needed, but
# leaving it wired as-is causes no issues (no Modbus master = nothing sent).
#
# Usage: see tools/wizard.py.

substitutions:
  name: innova-sniffer

esphome:
  name: ${name}

esp8266:
  board: d1_mini

# Serial logger disabled: UART0 (in swap mode on GPIO15/13) is dedicated to
# sniffing. Logs arrive via WiFi/API (see tools/wizard.py).
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret fancoil_api_key

ota:
  - platform: esphome
    password: !secret fancoil_ota_password

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"
    password: !secret wifi_password

captive_portal:

# UART0 hardware in swap mode: GPIO15=TX (pin D8, unused), GPIO13=RX (pin D7,
# connected through the level shifter to the mainboard's TX).
uart:
  id: uart_bus
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  stop_bits: 1
  debug:
    direction: RX
    after:
      timeout: 20ms
    sequence:
      - lambda: |-
          std::string hex;
          char buf[4];
          for (auto b : bytes) {
            sprintf(buf, "%02X ", b);
            hex += buf;
          }
          ESP_LOGD("sniff", "RX %s", hex.c_str());
