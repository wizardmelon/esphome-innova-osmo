# Innova OSMO fancoil — replaces the INNOVA-WIFI module with a Lolin D1 mini.
# For a new fancoil: copy this file, change ONLY the substitutions below.
#
# WARNING: THE MAINBOARD BUS IS IN THE 5V DOMAIN (its TX idles at ~5V):
#   you need a bidirectional level shifter (4ch BSS138 module) on both lines.
#   NEVER wire the data lines straight to the ESP.
#
# WARNING: EN PIN DANGER: on the left header, the EN pin sits right next to
#   the two 12V pins (5th and 6th pin). Accidentally bridging EN to 12V
#   INSTANTLY destroys the proprietary chip that runs the mainboard (no spare
#   part available).
#
# Wiring D1 mini <-> level shifter <-> J3/J4 header (the D1 mini takes the
# place of the original module, same role as Modbus master, so no TX/RX swap):
#   shifter HV  -> 5V header          shifter LV  -> 3V3 D1 mini
#   shifter GND -> GND (shared with D1 mini)
#   HV1 -> mainboard TX line (idle ~5V)    LV1 -> D7 (GPIO13, ESP RX)
#   HV2 -> mainboard RX line (idle ~1.5V)  LV2 -> D8 (GPIO15, ESP TX)
#   5V header -> 5V D1 mini (rail verified: 4.99V)
# MANDATORY: 1 kOhm resistor between D8 and GND (GPIO15 is a boot strap pin:
# must be low at power-up; the shifter channel's pull-up would otherwise
# float it high).
# The original WiFi module must be REMOVED before connecting the ESP (only
# one master allowed on the bus).
#
# friendly_name determines the HA entity_id: "Fancoil 1" -> climate.fancoil_1

substitutions:
  name: fancoil-1
  friendly_name: Fancoil 1

  # --- External reference sensor (optional, see block further down) --------
  # The fancoil's on-board sensor sits ~10cm off the floor and doesn't
  # represent the actual room temperature well. If you already have an
  # external thermometer available in Home Assistant (Zigbee, WiFi, any
  # integration), you can use it as a reference: the climate will show its
  # reading as the current temperature, and the setpoint written to the
  # mainboard will be dynamically corrected to keep the fancoil running until
  # the room (not the on-board sensor) reaches the target.
  reference_temperature_entity: sensor.living_room_thermometer
  reference_temperature_timeout: 60min  # beyond this, the sensor is considered "unavailable"
  reference_temperature_deadband: "0.3"  # error below which no correction is applied (avoids oscillation)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

# Serial logger disabled: UART0 (in swap mode on GPIO15/13) is dedicated to Modbus.
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret fancoil_api_key

ota:
  - platform: esphome
    password: !secret fancoil_ota_password

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"
    password: !secret wifi_password

captive_portal:

status_led:
  pin:
    number: GPIO2
    inverted: true

external_components:
  - source:
      type: local
      path: components

# UART0 hardware in swap mode: GPIO15=TX (pin D8), GPIO13=RX (pin D7).
# No CH340 in the way (the D1 mini's GPIO1/GPIO3 pins can't receive from
# external devices: the on-board USB converter loads the line).
# Bonus: the 74880 baud bootloader garbage only comes out on GPIO1, so the
# mainboard never sees it.
uart:
  id: uart_bus
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: 9600
  stop_bits: 1

modbus:
  uart_id: uart_bus

# --- External reference sensor (optional) ----------------------------------
# Uncomment this block and the "reference_temperature_*" section below in the
# "climate" platform to use a Home Assistant thermometer entity (any
# integration: Zigbee2MQTT, ZHA, WiFi, etc.) instead of the on-board sensor.
# Nothing else needed: the component already hooks into the "api:" connection
# defined above, no MQTT or extra credentials required.
#
# sensor:
#   - platform: homeassistant
#     id: reference_temperature
#     entity_id: ${reference_temperature_entity}

climate:
  - platform: innova_osmo
    name: ""              # main climate entity: takes friendly_name
    address: 1            # mainboard slave address (verified: 1)
    update_interval: 10s

    # Explicit so the setpoint is adjustable in tenths of a degree regardless
    # of ESPHome's default: register 305 is already in tenths (target*10), so
    # this step is only a UI/HA-side limit, not a protocol one.
    visual:
      min_temperature: 16 °C
      max_temperature: 30 °C
      temperature_step:
        target_temperature: 0.1
        current_temperature: 0.1

    air_temperature:
      name: Temperature

    water_temperature:
      name: Water temperature

    fan_speed_percent:
      name: Fan

    water_alarm:
      name: Water alarm

    # Raw value of the status register (151): useful for discovering other
    # alarm bits. Remove it once you no longer need it.
    status_raw:
      name: Status raw

    # Uncomment together with the "sensor: platform: homeassistant" block above.
    # reference_temperature_sensor: reference_temperature
    # reference_temperature_timeout: ${reference_temperature_timeout}
    # reference_temperature_deadband: ${reference_temperature_deadband}
    # reference_temperature_problem:
    #   name: External thermometer unavailable
